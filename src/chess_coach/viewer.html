<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>chess-coach analysis</title>
<style>
:root{--bg:#262421;--panel:#21201d;--panel2:#2b2926;--text:#bababa;--hi:#fff;--green:#81b64c;--sq-l:#eeeed2;--sq-d:#769656;
--best:#96bc4b;--excellent:#96bc4b;--good:#a3a38a;--inaccuracy:#f7c631;--mistake:#e6912c;--blunder:#ca3431;--miss:#dc6e8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}
#app{display:flex;gap:14px;justify-content:center;align-items:flex-start;padding:14px;flex-wrap:wrap}
#left{display:flex;gap:8px}#bar{width:26px;height:min(80vh,640px);background:#403d39;border-radius:3px;position:relative;overflow:hidden;align-self:center}
#barw{position:absolute;left:0;right:0;background:#fff;transition:height .25s}#barl{position:absolute;left:0;right:0;font-size:10px;text-align:center;font-weight:700}
#col{width:min(80vh,640px)}svg{display:block;width:100%}
.pl{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--panel);color:var(--hi);font-weight:600}
.pl small{color:var(--text);font-weight:400;margin-left:6px}.clock{background:#403d39;border-radius:3px;padding:2px 8px;font-variant-numeric:tabular-nums}
#nav{display:flex;gap:6px;justify-content:center;padding:8px}button{background:#403d39;color:var(--hi);border:0;border-radius:4px;padding:7px 16px;cursor:pointer;font-size:15px}button:hover{background:#4f4c47}
#right{width:min(94vw,400px);display:flex;flex-direction:column;gap:10px}.card{background:var(--panel);border-radius:6px;padding:10px}
h2{margin:0 0 4px;font-size:15px;color:var(--hi)}.sub{font-size:12px}#prog{height:4px;background:#403d39;border-radius:2px;overflow:hidden;margin-top:6px}#progf{height:100%;background:var(--green);width:0;transition:width .3s}
#eng{font-size:13px;line-height:1.5}#eng b{color:var(--hi)}#graph{cursor:pointer}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum div{background:var(--panel2);border-radius:4px;padding:6px 8px;font-size:12px}.sum b{font-size:18px;color:var(--hi);display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
#moves{max-height:340px;overflow:auto;padding:0}.row{display:grid;grid-template-columns:34px 1fr 1fr}.num{color:#777;padding:5px 6px;background:var(--panel2)}
.mv{padding:5px 6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}.mv:hover{background:#34322e}.mv.cur{background:#454139;color:var(--hi)}
.mv i{font-style:normal;color:#8a8a85;font-size:12px}.badge{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:50%;font-size:10px;font-weight:800;color:#222;text-align:center;margin-right:4px}
#err{color:var(--blunder)}
</style></head><body><div id="app">
<div id="left"><div id="bar"><div id="barw"></div><div id="barl"></div></div>
<div id="col"><div class="pl" id="top"></div><svg id="board" viewBox="0 0 800 800"></svg><div class="pl" id="bot"></div>
<div id="nav"><button id="b0">⏮</button><button id="b1">◀</button><button id="b2">▶</button><button id="b3">⏭</button><button id="bf" title="flip (f)">⇅</button></div></div></div>
<div id="right">
<div class="card"><h2 id="title">Loading…</h2><div class="sub" id="sub"></div><div id="prog"><div id="progf"></div></div><div id="err"></div></div>
<div class="card" id="eng"></div>
<div class="card"><svg id="graph" viewBox="0 0 360 80" preserveAspectRatio="none" style="height:80px"></svg></div>
<div class="card sum" id="sum"></div>
<div class="card" id="moves"></div></div></div>
<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const id=location.pathname.split('/').pop();
const COL={best:'--best',excellent:'--excellent',good:'--good',inaccuracy:'--inaccuracy',mistake:'--mistake',blunder:'--blunder',miss:'--miss'};
const SYM={best:'★',excellent:'✓',good:'•',inaccuracy:'?!',mistake:'?',blunder:'??',miss:'✕'};
const GLYPH={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let G=null,P={evals:[],moves:[],summary:{},done:false,n_done:0,total:1},cur=0,flip=false;
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(COL[n]);
const winp=cp=>50+50*(2/(1+Math.exp(-0.00368208*Math.max(-1000,Math.min(1000,cp))))-1);
function fmt(cp,sign=true){if(cp===null||cp===undefined)return '…';if(Math.abs(cp)>=9000){const d=10000-Math.abs(cp);return (cp<0?'-':'')+'M'+d}return (cp>0&&sign?'+':'')+(cp/100).toFixed(1)}
function mm(s){if(s==null)return '';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function el(tag,attrs={},parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;parent&&parent.appendChild(e);return e}
function parseFen(f){const rows=f.split(' ')[0].split('/'),b=[];for(const r of rows){const row=[];for(const c of r){if(/\d/.test(c))for(let i=0;i<+c;i++)row.push(null);else row.push(c)}b.push(row)}return b}
function sq(n){return [n.charCodeAt(0)-97,8-(+n[1])]}
function xy(f,r){return flip?[7-f,7-r]:[f,r]}
function drawBoard(){const s=$('board');s.innerHTML='';const b=parseFen(G.fens[cur]);const last=cur>0?G.plies[cur-1]:null;
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){const [x,y]=xy(f,r);const dark=(f+r)%2==1;el('rect',{x:x*100,y:y*100,width:100,height:100,fill:dark?'#769656':'#eeeed2'},s)}
 if(last){for(const n of [last.from,last.to]){const [f,r]=sq(n),[x,y]=xy(f,r);el('rect',{x:x*100,y:y*100,width:100,height:100,fill:'rgba(255,235,59,.45)'},s)}
  const m=P.moves[cur];if(m){const [f,r]=sq(last.to),[x,y]=xy(f,r);el('circle',{cx:x*100+88,cy:y*100+12,r:14,fill:cv(m.cls)},s);el('text',{x:x*100+88,y:y*100+13,'text-anchor':'middle','dominant-baseline':'central','font-size':m.cls.length&&SYM[m.cls].length>1?15:18,'font-weight':800,fill:'#222'},s,SYM[m.cls])}}
 const dk=(f,r)=>(f+r)%2==1,lab=(f,r)=>dk(f,r)?'#eeeed2':'#769656';
 for(let i=0;i<8;i++){const [x0]=xy(i,flip?0:7);el('text',{x:x0*100+92,y:792,'font-size':20,'text-anchor':'end','font-weight':600,fill:lab(i,flip?0:7)},s,'abcdefgh'[i]);
  const [,y1]=xy(flip?7:0,i);el('text',{x:6,y:y1*100+24,'font-size':20,'font-weight':600,fill:lab(flip?7:0,i)},s,String(8-i))}
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){const c=b[r][f];if(!c)continue;const [x,y]=xy(f,r),white=c===c.toUpperCase();
  el('text',{x:x*100+50,y:y*100+54,'text-anchor':'middle','dominant-baseline':'central','font-size':86,'font-family':'"Segoe UI Symbol","Noto Sans Symbols2","DejaVu Sans",sans-serif',fill:white?'#fff':'#1f1f1f',stroke:white?'#222':'#ddd','stroke-width':white?2.5:1.5,'paint-order':'stroke'},s,GLYPH[c.toLowerCase()])}
 // arrow: what should have been played, when the last move was not best
 const m=P.moves[cur];if(m&&m.best&&!['best','excellent','good'].includes(m.cls)&&m.best_san){const u=m.best,[f1,r1]=sq(u.slice(0,2)),[f2,r2]=sq(u.slice(2,4)),[x1,y1]=xy(f1,r1),[x2,y2]=xy(f2,r2);
  const ax=x1*100+50,ay=y1*100+50,bx=x2*100+50,by=y2*100+50,dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,hx=bx-ux*26,hy=by-uy*26;
  el('line',{x1:ax,y1:ay,x2:hx,y2:hy,stroke:'rgba(129,182,76,.9)','stroke-width':16,'stroke-linecap':'round'},s);
  el('polygon',{points:`${bx},${by} ${hx-uy*24},${hy+ux*24} ${hx+uy*24},${hy-ux*24}`,fill:'rgba(129,182,76,.9)'},s)}
}
function players(){const w=G.white+(G.white_elo?` <small>(${G.white_elo})</small>`:''),k=G.black+(G.black_elo?` <small>(${G.black_elo})</small>`:'');
 const clk=(white)=>{let t=null;for(let i=cur-1;i>=0;i--)if(G.plies[i].white===white&&G.plies[i].clock!=null){t=G.plies[i].clock;break}if(t===null&&cur===0&&G.init_clock)t=G.init_clock;return t==null?'':`<span class=clock>${mm(t)}</span>`};
 const [t,tc,bt,bc]=flip?[w,clk(true),k,clk(false)]:[k,clk(false),w,clk(true)];
 $('top').innerHTML=`<span>${t}</span>${tc}`;$('bot').innerHTML=`<span>${bt}</span>${bc}`}
function bar(){const e=P.evals[cur];const cp=e?e.cp:0,w=e?winp(cp):50,bw=$('barw'),l=$('barl');bw.style.height=w+'%';
 bw.style.top=flip?'0':'auto';bw.style.bottom=flip?'auto':'0';l.textContent=e?fmt(cp,false):'';
 const whiteEnd=flip?'top':'bottom',blackEnd=flip?'bottom':'top',atWhite=w>=50;
 l.style.top=l.style.bottom='auto';l.style[atWhite?whiteEnd:blackEnd]='4px';l.style.color=atWhite?'#222':'#ddd'}
function info(){const e=P.evals[cur],m=P.moves[cur],p=cur>0?G.plies[cur-1]:null;let h='';
 if(p){const n=Math.floor((cur+1)/2);h+=`<b>${n}${p.white?'.':'...'} ${p.san}</b> `;if(m){h+=`<span class=badge style="background:${cv(m.cls)}">${SYM[m.cls]}</span> <b>${m.cls}</b>`;
  if(m.cls!=='best'&&m.best_san)h+=` – best was <b>${m.best_san}</b>`+(m.loss>=10?` (−${m.loss}cp)`:'')}h+='<br>'}else h+='<b>Start position</b><br>';
 h+=e?`Eval <b>${fmt(e.cp)}</b> (White view) · depth ${G.depth}`+(e.line?`<br><span style="color:#999">${e.line}</span>`:''):'Evaluating…';$('eng').innerHTML=h}
function graph(){const s=$('graph');s.innerHTML='';const n=G.fens.length,W=360,H=80;const x=i=>n>1?i*W/(n-1):0,y=cp=>H-winp(cp)/100*H;
 el('rect',{x:0,y:0,width:W,height:H,fill:'#403d39'},s);let d=`M0 ${H}`;let last=0;
 for(let i=0;i<n;i++){const e=P.evals[i];if(!e)break;d+=` L${x(i).toFixed(1)} ${y(e.cp).toFixed(1)}`;last=i}d+=` L${x(last).toFixed(1)} ${H} Z`;el('path',{d,fill:'#e8e8e8'},s);
 el('line',{x1:0,x2:W,y1:H/2,y2:H/2,stroke:'#888','stroke-width':.5,'stroke-dasharray':'3 3'},s);
 for(let i=1;i<n;i++){const m=P.moves[i];if(m&&['mistake','blunder','miss'].includes(m.cls))el('circle',{cx:x(i),cy:y(P.evals[i].cp),r:2.6,fill:cv(m.cls)},s)}
 el('line',{x1:x(cur),x2:x(cur),y1:0,y2:H,stroke:'#81b64c','stroke-width':1.5},s)}
function summary(){const S=P.summary||{};const one=(c,name)=>{const s=S[c]||{counts:{}},k=s.counts||{};const tag=(n)=>k[n]?`<span class=dot style="background:${cv(n)}"></span>${k[n]} ${n} `:'';
  return `<div>${name}<b>${s.accuracy==null?'–':s.accuracy+'%'}</b>${['best','inaccuracy','mistake','blunder','miss'].map(tag).join('')}</div>`};
 $('sum').innerHTML=one('white',G.white)+one('black',G.black)+(G.cc_accuracy?`<div style="grid-column:span 2">chess.com accuracy (${G.mine}): <b style="display:inline">${G.cc_accuracy}</b></div>`:'')}
function moveList(){let h='';for(let i=1;i<G.fens.length;i+=2){const cell=j=>{if(j>=G.fens.length)return '<div class=mv></div>';const m=P.moves[j],e=P.evals[j];
  return `<div class="mv${j===cur?' cur':''}" data-i="${j}"><span>${m?`<span class=badge style="background:${cv(m.cls)}">${SYM[m.cls]}</span>`:''}${G.plies[j-1].san}</span><i>${e?fmt(e.cp):''}</i></div>`};
  h+=`<div class=row><div class=num>${(i+1)/2}</div>${cell(i)}${cell(i+1)}</div>`}
 const box=$('moves'),top=box.scrollTop;box.innerHTML=h;box.scrollTop=top;const c=box.querySelector('.cur');if(c){const r=c.getBoundingClientRect(),b=box.getBoundingClientRect();if(r.top<b.top||r.bottom>b.bottom)c.scrollIntoView({block:'center'})}
 box.querySelectorAll('.mv[data-i]').forEach(e=>e.onclick=()=>go(+e.dataset.i))}
function go(i){cur=Math.max(0,Math.min(G.fens.length-1,i));render()}
function render(){if(!G)return;drawBoard();players();bar();info();graph();summary();moveList();
 const pct=Math.round(100*P.n_done/P.total);$('progf').style.width=pct+'%';$('sub').textContent=`${G.date} · ${G.opening} · ${G.time_control||''} · ${G.result} (${G.how})`+(P.done?'':` · analysing ${P.n_done}/${P.total}`);
 $('prog').style.display=P.done?'none':'block';$('err').textContent=P.error||''}
async function poll(){try{const r=await fetch('/api/evals/'+id);P=await r.json();render();if(!P.done)setTimeout(poll,700)}catch(e){setTimeout(poll,2000)}}
async function init(){const r=await fetch('/api/game/'+id);if(!r.ok){$('title').textContent='Game not found';$('err').textContent=(await r.json()).error;return}
 G=await r.json();flip=G.mine==='black';$('title').textContent=`${G.white} vs ${G.black}`;document.title=`${G.white} vs ${G.black} – analysis`;
 P={evals:new Array(G.fens.length).fill(null),moves:new Array(G.fens.length).fill(null),summary:{},done:false,n_done:0,total:G.fens.length};render();poll()}
$('b0').onclick=()=>go(0);$('b1').onclick=()=>go(cur-1);$('b2').onclick=()=>go(cur+1);$('b3').onclick=()=>go(1e9);$('bf').onclick=()=>{flip=!flip;render()};
$('graph').onclick=e=>{const r=$('graph').getBoundingClientRect();go(Math.round((e.clientX-r.left)/r.width*(G.fens.length-1)))};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='ArrowRight')go(cur+1);else if(e.key==='Home')go(0);else if(e.key==='End')go(1e9);else if(e.key==='f')(flip=!flip,render());else return;e.preventDefault()});
init().then(()=>{const n=parseInt(location.hash.slice(1));if(n>=0)go(n)});
</script></body></html>
