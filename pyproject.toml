[project]
name = "chess-coach"
version = "0.1.0"
description = "Local MCP server: chess coach over chess.com games with Stockfish"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.12,<2",
    "python-chess>=1.999",
]

[project.scripts]
chess-coach-mcp = "chess_coach.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
